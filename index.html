<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_upward" />
</head>
<body>
    <div class="all">
        <div class="head">
            <h2>CRUD</h2>
            <p>Product Management System</p>
        </div>

        <div class="inputs">
            <input type="text" id="title" placeholder="title">
            <div class="price">
                <input type="number" onkeyup="getTotal()" id="price" placeholder="price">
                <input type="number" onkeyup="getTotal()" id="taxes" placeholder="taxes">
                <input type="number" onkeyup="getTotal()" id="ads" placeholder="ads">
                <input type="number" onkeyup="getTotal()" id="discount" placeholder="discount">
                <small id="total"></small>
            </div>
            <input type="number" id="count" placeholder="Count">
            <input type="text" id="category" placeholder="category">
            <button id="submit">Create</button>
        </div>

        <div class="outouts">
            <div class="searchBlock">
                <input onkeyup="searching(this.value)" type="text" id="Search" placeholder="Search">
                <div class="btnDearch">
                    <button onclick="searchState(this.id)" id="searchTitle">Search By Title</button>
                    <button onclick="searchState(this.id)" id="searchCategorie">Search By Categorie</button>
                </div>
            </div>
        </div>
        <div id="deleteAll">
        </div>
        <button id="up">
            <span class="material-symbols-outlined">
                arrow_upward
            </span>
        </button>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>TITLE</th>
                    <th>PRICE</th>
                    <th>TAXES</th>
                    <th>ADS</th>
                    <th>DISCOUNT</th>
                    <th>TOTAL</th>
                    <th>CATEGORY</th>
                    <th>UPDATE</th>
                    <th>DELETE</th>
                </tr>
            </thead>

            <tbody>
            </tbody>
        </table>
        
    </div>
    <div id="toggle">
        <div class="toggleSwitch "></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
